<!-- 0) text-align აძლევს ტექსტს განლაგების მიმართულებას (მარცხნივ, ცენტრში, მარჯვნივ და ა.შ.) -->

<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>CSS მაგალითები</title>
  <style>
    /* 1) <p> ტექსტი ცენტრში */
    p {
      text-align: center;
    }

    /* 2) <h1> ელემენტი ლურჯი და 30px ზომით */
    h1 {
      color: blue;
      font-size: 30px;
    }

    /* 3) ყველა <p> ტექსტს ვაძლევთ სქელ შრიფტს */
    p {
      font-weight: bold;
    }

    /* 4) <span> ტექსტი ხაზგასმული */
    span {
      text-decoration: underline;
    }

    /* 5) ყველა <h2> ტექსტი წითელი და დახრილი */
    h2 {
      font-style: italic;
      color: rgb(251, 255, 0);
    }
  </style>
</head>
<body>

  <h1>ეს არის სათაური</h1>
  <h2>ეს არის მეორე დონის სათაური</h2>
  <p>ეს არის პერაგრაფი ცენტრში და სქელი შრიფტით</p>
  <span>ეს ტექსტი ხაზგასმულია</span>

</body>
</html>
