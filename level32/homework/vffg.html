<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <title>Functions Example</title>
</head>
<body>
  <h2>ფუნქციების მაგალითები JavaScript-ში</h2>

  <script>
    // 0) ფუნქცია, რომელიც ამატებს 5-ს
    function add_five(num) {
      return num + 5;
    }

    // 1) ფუნქცია, რომელიც აბრუნებს სიტყვის ბოლო ასოს
    function last_char(text) {
      return text[text.length - 1];
    }

    // 2) ფუნქცია, რომელიც ამოწმებს, არის თუ არა რიცხვი ლუწი
    function is_even(num) {
      return num % 2 === 0;
    }

    // 3) ფუნქცია, რომელიც აბრუნებს ორი რიცხვის ჯამს
    function sum_two(a, b) {
      return a + b;
    }

    // 4) ფუნქცია, რომელიც აბრუნებს უფრო დიდ რიცხვს ორიდან
    function bigger(a, b) {
      return a > b ? a : b;}
    

    console.log("add_five(10) =", add_five(10));
    console.log("last_char('Nika') =", last_char('Nika'));
    console.log("is_even(7) =", is_even(7));
    console.log("sum_two(4, 6) =", sum_two(4, 6));
    console.log("bigger(9, 12) =", bigger(9, 12));
  </script>
</body>
</html>
